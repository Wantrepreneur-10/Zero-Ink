<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zero Ink">
<title>Zero Ink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%2307090d'/%3E%3Cpath d='M256 110 C188 212 150 262 150 330 a106 106 0 0 0 212 0 C362 262 324 212 256 110 Z' fill='%2300e5a0'/%3E%3Ccircle cx='256' cy='320' r='34' fill='%2307090d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div class="loader"><div class="spin"></div><div class="muted" style="font-size:13px">Connecting…</div></div></div>

<div class="toast" id="toast">
  <div class="th"><div class="dot"></div><div class="tt" id="toast-t">Receipt received</div></div>
  <div class="ts" id="toast-store"></div><div class="ta" id="toast-amt"></div><div class="ti" id="toast-items"></div>
</div>
<input type="file" id="menu-photo" accept="image/*" class="hidden">

<script type="module" src="js/main.js"></script>
<script>
  // If the app modules can't load (offline, blocked CDN), say so instead of spinning forever.
  setTimeout(function () {
    if (!window.__ziBooted) {
      document.getElementById('app').innerHTML =
        '<div class="loader"><div style="font-size:40px">⚠️</div><div style="color:#8892a8;text-align:center;padding:0 30px">Couldn\'t load Zero Ink.<br>Check your connection.<br><button class="btn small" style="margin-top:14px" onclick="location.reload()">Try again</button></div></div>';
    }
  }, 12000);
</script>
</body>
</html>
